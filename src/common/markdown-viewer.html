<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Viewer</title>
  <link rel="stylesheet" href="lib/github.min.css" id="hljs-light-theme">
  <link rel="stylesheet" href="lib/github-dark.min.css" id="hljs-dark-theme" disabled>
  <link rel="stylesheet" href="styles.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <div class="app-wrapper">
    <!-- Header toolbar -->
    <header class="header">
      <div class="header-actions">
        <label class="btn" id="open-file-btn" title="" data-i18n-title="openFile">
          <input type="file" id="file-input" accept=".md,.markdown" style="display:none">
          📂 <span data-i18n="openFile">Open File</span>
        </label>

        <!-- Theme toggle -->
        <div class="btn-group" role="group" aria-label="Theme">
          <button class="btn" id="theme-light-btn" data-i18n-title="themeLight" aria-label="Light theme">☀️</button>
          <button class="btn active" id="theme-auto-btn" data-i18n-title="themeAuto" aria-label="Auto theme">💻</button>
          <button class="btn" id="theme-dark-btn" data-i18n-title="themeDark" aria-label="Dark theme">🌙</button>
        </div>
      </div>

      <span class="header-title" id="file-title">Markdown Viewer</span>

      <div class="header-options">
        <div class="plantuml-settings">
          <button class="btn" id="plantuml-settings-btn" type="button" data-i18n-title="plantumlRenderSettings" aria-label="PlantUML settings">🧩</button>
          <div class="plantuml-settings-panel hidden" id="plantuml-settings-panel">
            <div class="plantuml-settings-title" data-i18n="plantumlRenderSettings">PlantUML Rendering</div>
            <label class="plantuml-settings-row">
              <input type="checkbox" id="plantuml-local-checkbox">
              <span data-i18n="plantumlRenderLocal">Local rendering</span>
            </label>
            <label class="plantuml-settings-row">
              <input type="checkbox" id="plantuml-server-checkbox">
              <span data-i18n="plantumlRenderServer">PlantUML server rendering</span>
            </label>
            <label class="plantuml-settings-row plantuml-server-url">
              <span data-i18n="plantumlServerLabel">PlantUML Server</span>
              <input type="text" id="plantuml-server-input" data-i18n-placeholder="plantumlServerPlaceholder" placeholder="https://kroki.io">
            </label>
          </div>
        </div>
      </div>
    </header>

    <!-- Main content area -->
    <div class="main-area">
      <!-- Sidebar / TOC -->
      <aside class="sidebar hidden" id="sidebar">
        <div class="sidebar-header">
          <span class="sidebar-header-text" data-i18n="tableOfContents">Table of Contents</span>
          <button class="btn sidebar-toggle-btn" id="sidebar-toggle-btn" title="Collapse sidebar">◀</button>
        </div>
        <div class="toc-scroll-wrapper" id="toc-scroll-wrapper">
          <ul class="toc-list" id="toc-list"></ul>
        </div>
      </aside>
      <div class="sidebar-resizer hidden" id="sidebar-resizer"></div>

      <!-- Markdown content -->
      <main class="content-area" id="content-area">
        <!-- Drop zone (shown when no file loaded) -->
        <div class="drop-zone" id="drop-zone">
          <div class="drop-zone-icon">📝</div>
          <div class="drop-zone-text" data-i18n="dropFileHere">
            Drop a Markdown file here, or click to open
          </div>
        </div>

        <!-- Rendered markdown output -->
        <article class="markdown-body hidden" id="markdown-body" translate="yes"></article>
      </main>
    </div>
  </div>

  <!-- Hidden file input for linked files -->
  <input type="file" id="linked-file-input" accept=".md,.markdown" style="display:none">

  <script src="lib/markdown-it.min.js"></script>
  <script src="lib/highlight.min.js"></script>
  <script src="lib/pako_deflate.min.js"></script>
  <script src="lib/mermaid.min.js"></script>
  <script src="i18n.js"></script>
  <script src="markdown-viewer.js"></script>
</body>
</html>
